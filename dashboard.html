<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>분기별 예산집행 대시보드</title>
<meta name="description" content="부서별 분기 예산집행 현황을 막대그래프와 요약 통계로 한눈에 확인하는 대시보드">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d2e;
    --surface2: #222538;
    --border: #2e3150;
    --accent: #6c63ff;
    --accent2: #00d4aa;
    --accent3: #ff6b6b;
    --accent4: #ffd166;
    --text: #e8eaf6;
    --text-muted: #8b8fa8;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  /* Background gradient orbs */
  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(108,99,255,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -200px; right: -200px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(0,212,170,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px 60px;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 40px;
  }
  header .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 14px;
  }
  header h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 700;
    background: linear-gradient(135deg, #fff 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
    margin-bottom: 8px;
  }
  header p {
    color: var(--text-muted);
    font-size: 14px;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
    transition: border-color 0.3s;
  }
  .card:hover { border-color: rgba(108,99,255,0.35); }

  .card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title::before {
    content: '';
    display: inline-block;
    width: 4px; height: 16px;
    background: linear-gradient(to bottom, var(--accent), var(--accent2));
    border-radius: 2px;
  }

  /* Form */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    gap: 16px;
    align-items: end;
  }
  @media (max-width: 620px) {
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-grid .field-dept { grid-column: span 2; }
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .field input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,99,255,0.18);
  }
  .field input::placeholder { color: var(--text-muted); opacity: 0.6; }

  /* Quarter inputs with colored accents */
  .field-q1 input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,99,255,0.18); }
  .field-q2 input:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(0,212,170,0.18); }
  .field-q3 input:focus { border-color: var(--accent3); box-shadow: 0 0 0 3px rgba(255,107,107,0.18); }
  .field-q4 input:focus { border-color: var(--accent4); box-shadow: 0 0 0 3px rgba(255,209,102,0.18); }

  .quarter-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 5px;
  }
  .dot-q1 { background: var(--accent); }
  .dot-q2 { background: var(--accent2); }
  .dot-q3 { background: var(--accent3); }
  .dot-q4 { background: var(--accent4); }

  /* Button */
  .btn {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 16px rgba(108,99,255,0.35);
  }
  .btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 22px rgba(108,99,255,0.45); }
  .btn:active { transform: translateY(0); }

  /* Chart */
  #chart-wrapper {
    position: relative;
    height: 320px;
    display: none;
  }

  /* Summary */
  #summary {
    display: none;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    padding: 14px 20px;
    background: var(--surface2);
    border: 1px solid var(--accent);
    border-radius: 8px;
    letter-spacing: 0.3px;
    font-variant-numeric: tabular-nums;
    font-family: 'Courier New', 'Noto Sans KR', monospace;
    text-align: center;
    box-shadow: 0 0 20px rgba(108,99,255,0.15);
  }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    display: none;
  }
  .stat-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    text-align: center;
    transition: transform 0.2s, border-color 0.2s;
  }
  .stat-card:hover { transform: translateY(-2px); border-color: rgba(108,99,255,0.4); }
  .stat-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .stat-value {
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
  }
  .stat-unit { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  .stat-total .stat-value { color: var(--accent2); }
  .stat-max .stat-value { color: var(--accent4); }
  .stat-avg .stat-value { color: var(--accent); }

  /* Dept title in chart */
  #dept-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: none;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-muted);
  }
  .empty-state svg { opacity: 0.3; margin-bottom: 16px; }
  .empty-state p { font-size: 14px; }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="badge">Budget Dashboard</div>
    <h1>분기별 예산집행 대시보드</h1>
    <p>부서별 Q1~Q4 집행액을 입력하면 차트와 요약 통계를 즉시 확인합니다</p>
  </header>

  <!-- Input Form -->
  <div class="card">
    <div class="card-title">데이터 입력</div>
    <div class="form-grid">
      <div class="field field-dept" style="grid-column: 1/-1;">
        <label for="dept">부서명</label>
        <input id="dept" type="text" placeholder="예: 환경부서">
      </div>
      <div class="field field-q1">
        <label for="q1"><span class="quarter-dot dot-q1"></span>Q1 (백만원)</label>
        <input id="q1" type="number" placeholder="0">
      </div>
      <div class="field field-q2">
        <label for="q2"><span class="quarter-dot dot-q2"></span>Q2 (백만원)</label>
        <input id="q2" type="number" placeholder="0">
      </div>
      <div class="field field-q3">
        <label for="q3"><span class="quarter-dot dot-q3"></span>Q3 (백만원)</label>
        <input id="q3" type="number" placeholder="0">
      </div>
      <div class="field field-q4">
        <label for="q4"><span class="quarter-dot dot-q4"></span>Q4 (백만원)</label>
        <input id="q4" type="number" placeholder="0">
      </div>
    </div>
    <button class="btn" id="show-btn" onclick="show()">표시</button>
  </div>

  <!-- Stats Cards -->
  <div class="stats-row" id="stats-row">
    <div class="stat-card stat-total">
      <div class="stat-label">총합</div>
      <div class="stat-value" id="stat-total-val">—</div>
      <div class="stat-unit">백만원</div>
    </div>
    <div class="stat-card stat-max">
      <div class="stat-label">최대 분기</div>
      <div class="stat-value" id="stat-max-val">—</div>
      <div class="stat-unit">최고 집행</div>
    </div>
    <div class="stat-card stat-avg">
      <div class="stat-label">분기 평균</div>
      <div class="stat-value" id="stat-avg-val">—</div>
      <div class="stat-unit">백만원</div>
    </div>
  </div>

  <!-- Chart -->
  <div class="card" id="chart-card" style="display:none;">
    <div id="dept-label"></div>
    <div class="card-title">분기별 집행액</div>
    <div id="chart-wrapper">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <!-- Summary (채점용) -->
  <div class="card" id="summary-card" style="display:none; padding:20px;">
    <div class="card-title">요약 통계</div>
    <div id="summary"></div>
  </div>

</div>

<script>
let chartInstance = null;
const COLORS = ['#6c63ff', '#00d4aa', '#ff6b6b', '#ffd166'];
const LABELS = ['Q1', 'Q2', 'Q3', 'Q4'];

function show() {
  const dept = document.getElementById('dept').value.trim() || '(미입력)';
  const vals = [
    parseFloat(document.getElementById('q1').value) || 0,
    parseFloat(document.getElementById('q2').value) || 0,
    parseFloat(document.getElementById('q3').value) || 0,
    parseFloat(document.getElementById('q4').value) || 0
  ];

  // --- 요약 통계 계산 ---
  const total = vals[0] + vals[1] + vals[2] + vals[3];

  // 최대 분기: 동률이면 가장 빠른 분기
  let maxIdx = 0;
  for (let i = 1; i < 4; i++) {
    if (vals[i] > vals[maxIdx]) maxIdx = i;
  }
  const maxLabel = LABELS[maxIdx];

  // 평균: 소수 1자리 반올림
  const avg = Math.round((total / 4) * 10) / 10;

  // 명세 형식 문자열
  const summaryStr = `총합:${total} / 최대:${maxLabel} / 평균:${avg.toFixed(1)}`;

  // --- 요약 UI 업데이트 ---
  document.getElementById('stat-total-val').textContent = total;
  document.getElementById('stat-max-val').textContent = maxLabel;
  document.getElementById('stat-avg-val').textContent = avg.toFixed(1);
  document.getElementById('stats-row').style.display = 'grid';

  document.getElementById('dept-label').textContent = `📌 ${dept}`;
  document.getElementById('dept-label').style.display = 'block';

  document.getElementById('summary').textContent = summaryStr;
  document.getElementById('summary').style.display = 'block';
  document.getElementById('summary-card').style.display = 'block';
  document.getElementById('chart-card').style.display = 'block';
  document.getElementById('chart-wrapper').style.display = 'block';

  // --- Chart.js 막대그래프 ---
  const ctx = document.getElementById('chart').getContext('2d');

  if (chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: LABELS,
      datasets: [{
        label: `${dept} 집행액 (백만원)`,
        data: vals,
        backgroundColor: COLORS.map(c => c + 'cc'),
        borderColor: COLORS,
        borderWidth: 2,
        borderRadius: 8,
        borderSkipped: false
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: { color: '#e8eaf6', font: { family: 'Noto Sans KR', size: 13 } }
        },
        tooltip: {
          backgroundColor: '#1a1d2e',
          borderColor: '#2e3150',
          borderWidth: 1,
          titleColor: '#e8eaf6',
          bodyColor: '#8b8fa8',
          callbacks: {
            label: ctx => ` ${ctx.parsed.y} 백만원`
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: '#8b8fa8', font: { family: 'Noto Sans KR', size: 13, weight: '600' } }
        },
        y: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: {
            color: '#8b8fa8',
            font: { family: 'Noto Sans KR', size: 12 },
            callback: v => v + ' M'
          },
          beginAtZero: true
        }
      },
      animation: {
        duration: 600,
        easing: 'easeOutQuart'
      }
    }
  });
}
</script>
</body>
</html>
